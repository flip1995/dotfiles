"$schema" = "https://jj-vcs.github.io/jj/latest/config-schema.json"
[user]
name = "Philipp Krones"
email = "hello@philkrones.com"

[signing]
behavior = "own"
backend = "gpg"
key = "1CA0DF2AF59D68A5"

[git]
sign-on-push = true

[ui]
merge-editor = "meld"
default-command = "log"
diff-formatter = ":git"
pager = "delta"

[snapshot]
auto-track = "none()"

[remotes.origin]
auto-track-created-bookmarks = "*"

[aliases]
tug = ["bookmark", "move", "--from", "heads(::@- & bookmarks())", "--to", "@"]
tug- = ["bookmark", "move", "--from", "heads(::@- & bookmarks())", "--to", "@-"]
untug = ["bookmark", "move", "--from", "roots(@+:: & bookmarks())", "--to", "@", "--allow-backwards"]

[revsets]
# If someone branches off my stack, show their remote commits and keep showing my own commits,
# instead of trimming them because they are immutable.
log = "builtin_log() | (::mutable() ~ ::trunk()) | (untracked_remote_bookmarks() & descendants(::mutable() ~ ::trunk()))"

[[--scope]]
--when.repositories = ["~/recogni"]
[--scope.user]
email = "philipp.krones@tensordyne.ai"
